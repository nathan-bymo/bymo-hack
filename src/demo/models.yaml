    caveats: ["OCR docTR e SigLIP 2 vanno scaricati sul host GPU insieme ad Apertus"]
    kaggle_dev: {score: 0.83177, submitted_at: "2026-11-27", source: "src/training/phase-2/reports/apertus-8B-vadapter-lora-heads/RISULTATI.md:10",
