models:

  - id: apertus-8b-vadapter-lora-heads-final
    display_name: "Apertus 8B · SigLIP 2 + OCR + LoRA + 6 heads, spatial features + attention pooling (final)"
    short_name: "Final model"
    description: "Our best. Apertus 8B fine-tuned together with an image encoder (SigLIP 2) and a text reader (OCR), on 9,645 labelled images."
    featured: true
    family: vadapter_heads
    adapter: HeadsAdapter
    runtime: worker_gpu
    weights:
      local_path: weights/apertus-8B-vadapter-lora-heads-final   # nel repo, Git LFS (lora/, trainable.pt, settings.json)
      location_label: "in our repo (Git LFS), 0.37 GB"
      copy_note: "anche nel repo HF privato nathan-monzani-bymo/galaxus-vlh-private, final-abt/model/best (RISULTATI.md:41-42)"
      files: ["lora/adapter_model.safetensors", "lora/adapter_config.json", "trainable.pt", "settings.json"]
      size_gb: 0.37                                                  # du -sh della cartella, 28/11
      requires_base: true
      extra_models: ["google/siglip2-base-patch16-224", "docTR fast_base + Felix92/doctr-torch-parseq-multilingual-v1"]
    code: {root: "src/training/phase-2/src/training/apertus-8B-vadapter-lora-heads", reference: "predict.py"}
    prompt: {version: "heads-task+ocr", side: 256, use_context_default: true, system_message: false}
    dtype: bfloat16
    confidence: {kind: full_distribution, method: head_softmax, training_loss: "focal gamma=2 + alpha effective"}
    training_label: "all train.csv except prompt-test (9,645 images)"
    training: {data: "train.csv tranne prompt-test (9.645 immagini)", phase: 2,
               seen_sets: [coverage, base, prompt-dev-600, validation_450, train_1500]}
    vram_estimate_gb: null
    memory: {gb: null, kind: not_reported,
             what: "fits one 48 GB L40S (bf16) or two 16 GB T4 (fp16)",
             source: "src/training/phase-2/reports/apertus-8B-vadapter-lora-heads/RISULTATI.md:15"}
    measured:
      - {what: "img/s (end to end, lettura immagini inclusa)", value: 6.2, conditions: "H200, prompt-test, SigLIP + VQ + OCR + Apertus",
         source: "src/training/phase-2/reports/apertus-8B-vadapter-lora-heads/RISULTATI.md:104", gpu_label: "H200 (HF)", cost_eligible: true}
      - {what: "img/s (end to end)", value: 4.9, conditions: "1× L40S, bf16, predizione del dev",
         source: "src/training/phase-2/reports/apertus-8B-vadapter-lora-heads/RISULTATI.md:15", gpu_label: "L40S (HF)", cost_eligible: true}
    evals:
      - {set: prompt-test, validity: held_out, provenance: reported_only, macro_f1: 0.821, weighted_f1: 0.917,
         source: "src/training/phase-2/reports/apertus-8B-vadapter-lora-heads/RISULTATI.md:62",
         note: "mai visto da nessun checkpoint (RISULTATI.md:54-55)"}
